name: e2e-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Run only tests matching this tag/text, e.g. @smoke'
        required: false
        default: ''

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_URL: ${{ secrets.API_URL }}
      UI_URL: ${{ secrets.UI_URL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
      LOCATION_ID: ${{ secrets.LOCATION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck

      # a failed test must not stop the pipeline before the report is uploaded
      - name: Run tests
        id: run
        continue-on-error: true
        run: npx playwright test ${{ github.event.inputs.grep && format('--grep "{0}"', github.event.inputs.grep) || '' }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Fail the job if tests failed
        if: steps.run.outcome == 'failure'
        run: exit 1
